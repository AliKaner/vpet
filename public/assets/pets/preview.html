<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vpet • Sprite gallery</title>
<style>body{margin:0;padding:32px;background:#fdf6ec;color:#5b4638;font:14px system-ui}h1{margin:0 0 8px}p{color:#8a7266}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:1000px}.cell{background:#e7efda;border-radius:20px;text-align:center;padding:8px}.sprite{display:block;width:192px;height:192px;max-width:100%;margin:auto;background-image:url(pet-atlas-v2.png);background-size:400% 600%;image-rendering:pixelated}@media(max-width:600px){main{grid-template-columns:repeat(2,1fr)}.sprite{width:128px;height:128px}}</style>
<h1>Meet your little companions</h1><p>Six species · Idle / Feed / Affection / Clean · 24 pixel-art poses</p><main id="gallery"></main>
<script>const species=['Cat','Dog','Bird','Snake','Mouse','Horse'],poses=['Idle','Feed','Affection','Clean'];species.forEach((name,row)=>poses.forEach((pose,col)=>{const cell=document.createElement('div');cell.className='cell';const sprite=document.createElement('span');sprite.className='sprite';sprite.style.backgroundPosition=`${col*100/3}% ${row===5?97.5:row*20}%`;sprite.style.clipPath=row===4?'inset(0 0 12% 0)':row===3?'inset(0 0 3% 0)':'';cell.append(sprite,document.createTextNode(`${name} · ${pose}`));document.querySelector('main').append(cell)}));</script></html>
